# Render Blueprint — deploy with one click from dashboard.render.com (New → Blueprint)
services:
  - type: web
    name: stocksage
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /
